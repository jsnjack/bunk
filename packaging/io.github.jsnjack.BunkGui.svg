<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="face" x1="0" y1="12" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="12" y="12" width="104" height="96" rx="12"/>
    </clipPath>
  </defs>
  <!-- Bottom edge, so the tile reads as a slab in the GNOME style. -->
  <rect x="12" y="20" width="104" height="96" rx="12" fill="#5e5c64"/>
  <rect x="12" y="12" width="104" height="96" rx="12" fill="url(#face)"/>
  <!-- Tab rail with one status dot per agent: working, needs you, idle. -->
  <g clip-path="url(#body)">
    <rect x="12" y="12" width="24" height="96" fill="#000000" fill-opacity="0.28"/>
  </g>
  <circle cx="24" cy="32" r="5" fill="#33d17a"/>
  <circle cx="24" cy="50" r="5" fill="#f6d32d"/>
  <circle cx="24" cy="68" r="5" fill="#77767b"/>
  <!-- Prompt. -->
  <path d="M50 42 L66 56 L50 70" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="72" y="64" width="26" height="8" rx="4" fill="#c0bfbc"/>
</svg>
